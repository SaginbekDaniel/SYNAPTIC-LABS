# Weekly, grouped updates so the queue stays reviewable. Every update runs the full CI,
# including the production-image smoke test.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      python-minor-patch: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /apps/web
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 5
    groups:
      web-minor-patch: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /apps/pitch
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3
    groups:
      pitch-minor-patch: {update-types: [minor, patch]}

  - package-ecosystem: npm
    directory: /.railway
    schedule: {interval: monthly}
    open-pull-requests-limit: 2

  - package-ecosystem: docker
    directories: [/, /apps/web]
    schedule: {interval: weekly, day: monday}
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: monthly}
    groups:
      actions: {patterns: ["*"]}
