name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, types, tests, E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nexora" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXORA_DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      NEXORA_TEST_DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
      NEXORA_E2E_DATABASE_URL: postgresql+psycopg://nexora:nexora@localhost:5432/nexora_test
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with: {enable-cache: true}
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - run: uv sync --frozen
      - name: Lint and types (Python)
        run: |
          uv run ruff check src tests migrations
          uv run ruff format --check src tests migrations
          uv run mypy
      - name: Migrations apply and match ORM
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - name: Python unit + integration tests
        run: uv run pytest
      - name: Web install, types, unit tests, build
        working-directory: apps/web
        run: |
          npm ci
          npx tsc -b
          npx vitest run
          npx vite build
      - name: OpenAPI client is in sync with the API
        working-directory: apps/web
        run: |
          npm run gen:api
          git diff --exit-code -- openapi.json src/lib/api-types.ts
      - name: Browser E2E
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Keep Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/web/test-results
          retention-days: 7

  deploy-config:
    name: Deployment config (Railway IaC, shell)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: .railway/package-lock.json}
      - name: Railway definition type-checks and keeps its security invariants
        working-directory: .railway
        run: |
          npm ci
          npm run check
      - name: ShellCheck
        run: |
          shellcheck scripts/*.sh scripts/railway/*.sh apps/web/docker/*.envsh

  containers:
    name: Production images + gateway smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Exercise the gateway exactly as deployed: access control on. CI-only throwaway credentials.
      NEXORA_GATEWAY_AUTH: basic
      NEXORA_GATEWAY_USER: ci
      NEXORA_GATEWAY_PASSWORD: ci-only-throwaway-password
      NEXORA_GATEWAY_TOKEN: ci-only-gateway-token
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build API/worker image
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: nexora/app:local
          load: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
      - name: Build gateway image
        uses: docker/build-push-action@v7
        with:
          context: apps/web
          tags: nexora/web:local
          load: true
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: Images run as non-root
        run: |
          test "$(docker run --rm --entrypoint id nexora/app:local -u)" != 0
          test "$(docker run --rm --entrypoint id nexora/web:local -u)" != 0
      - name: Gateway refuses to start without credentials (fails closed)
        run: |
          if docker run --rm -e NEXORA_GATEWAY_AUTH=basic nexora/web:local; then
            echo "gateway started without credentials" >&2; exit 1
          fi
      - name: Start the stack (compose, production images)
        run: |
          docker compose config -q
          docker compose up -d --no-build --wait --wait-timeout 180
      - uses: actions/setup-node@v7
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/web/package-lock.json}
      - name: Smoke test through the gateway
        working-directory: apps/web
        env:
          NEXORA_SMOKE_URL: http://127.0.0.1:8080
          NEXORA_SMOKE_USER: ci
          NEXORA_SMOKE_PASSWORD: ci-only-throwaway-password
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npx playwright test -c playwright.smoke.config.ts
      - name: Worker stops gracefully
        run: |
          docker compose stop worker
          docker compose logs worker | grep -q "stopped after"
      - name: Stack logs
        if: always()
        run: docker compose logs --no-color --tail 200
