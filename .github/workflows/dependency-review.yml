name: dependency-review
on: pull_request

permissions:
  contents: read

jobs:
  review:
    name: New dependencies have no known high-severity vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
