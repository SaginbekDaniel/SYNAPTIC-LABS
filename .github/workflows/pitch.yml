name: pitch
on:
  push:
    paths: ["apps/pitch/**", ".github/workflows/pitch.yml"]
  pull_request:
    paths: ["apps/pitch/**", ".github/workflows/pitch.yml"]

jobs:
  pitch:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/pitch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: apps/pitch/package-lock.json}
      - run: npm ci
      - name: Lint, types, unit tests
        run: |
          npm run lint
          npx tsc -b
          npm test
      - name: Production build
        run: npm run build
      - name: Static server smoke test (the exact process that is deployed)
        run: |
          PORT=8099 node server.mjs &
          sleep 2
          node scripts/smoke.mjs http://127.0.0.1:8099
      - name: Browser E2E (navigation, interactions, safe area, a11y)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test --trace off
