# NEXORA detector configuration v2. Every value is a product hypothesis evaluated on the
# synthetic development split — not a discovered optimum. The frozen v1 baseline lives in
# configs/v1 and must keep reproducing its recorded benchmark. Changing any value changes the
# config hash and therefore produces a new snapshot identity.
version: detectors-v2
funnel:
  detector_version: funnel-v2
  min_feeders: 3              # distinct senders that route most of their observed outflow to the centre
  min_feeder_share: 0.5       # volume(s->c) / observed outgoing volume of s, same currency
  min_incoming_minor: "5000000"   # 50 000.00 KZT in tiyn; decimal string to keep money exact
  strength_model: dedication  # v2: strength from feeders' median share, not feeder count (FRAUD_FAILURE_ANALYSIS §2)
chain:
  detector_version: chain-v1  # path enumeration unchanged; v2 changes how its temporal claim is attributed
  min_hops: 3
  max_hops: 5
  intermediary_max_degree: 4
  pass_through_min_ratio: 0.5
  min_edge_minor: "1000000"
  hop_amount_min_ratio: 0.5
  max_paths: 2000
  max_expansions: 50000
fanout:
  detector_version: fanout-v1
  min_recipients: 4           # distinct receivers; "many" per spec §9.2 — set before measurement
  min_recipient_share: 0.5    # volume(s->r) / observed incoming volume of r
  min_outgoing_minor: "5000000"
  strength_model: dedication
cycle:
  detector_version: cycle-v1
  min_length: 2
  max_length: 5
  min_edge_minor: "1000000"
  min_episodes: 2             # a single round trip is ordinary (refund, repayment); repetition is the pattern
  leg_amount_min_ratio: "0.9" # each leg keeps >= 90 % of the previous leg (fees), never grows by > 2 %
  leg_amount_max_ratio: "1.02"
  max_cycles: 500
  max_expansions: 50000
temporal:
  detector_version: flow-v2
  max_hop_lag_days: 7
  min_compatible_fraction: 0.5
  max_transfers: 600
  attribution: pro_rata       # v2: fungibility-aware bound combined with max-flow (FRAUD_FAILURE_ANALYSIS §4)
context:
  detector_version: context-v1
  recurrence_min_span_days: 7 # a relationship active on dates >= 7 days apart is not a single burst
  scheduled_min_payout_dates: 4  # weekly over a monthly window; up to 3 batches stays consistent with an episode
  min_share: 0.5
