# Local demo stack — same topology as the Railway deployment (docs/deployment/railway.md):
# gateway (web) -> api -> postgres, plus worker, with migrations as a one-shot step.
# Ports bind to 127.0.0.1 only: this is not a public deployment.
#
# Sign-in needs an analyst account (none is created automatically). Once the stack is up:
#   docker compose run --rm api python -m nexora.auth.cli create-user <name> --generate
x-app-env: &app_env
  NEXORA_DATABASE_URL: postgresql+psycopg://nexora:${POSTGRES_PASSWORD:-nexora}@postgres:5432/nexora
  NEXORA_CORS_ORIGINS: http://127.0.0.1:8080,http://localhost:8080
  # Requests must arrive through the gateway (or carry this header). Not a secret locally.
  NEXORA_GATEWAY_TOKEN: ${NEXORA_GATEWAY_TOKEN:-local-only-gateway-token-not-a-secret}
  # Plain HTTP on loopback: the session cookie cannot be Secure here. Railway keeps the default (true).
  NEXORA_SESSION_COOKIE_SECURE: ${NEXORA_SESSION_COOKIE_SECURE:-false}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexora}
      POSTGRES_DB: nexora
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexora -d nexora"]
      interval: 3s
      timeout: 3s
      retries: 20
    ports: ["127.0.0.1:5433:5432"]

  migrate:
    image: nexora/app:local
    build: .
    command: ["alembic", "upgrade", "head"]
    environment: *app_env
    depends_on:
      postgres: {condition: service_healthy}

  api:
    image: nexora/app:local
    build: .
    environment: *app_env
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Direct API access for local debugging (/docs). Send X-Nexora-Gateway-Token for /api routes.
    ports: ["127.0.0.1:8000:8000"]

  worker:
    image: nexora/app:local
    build: .
    command: ["python", "-m", "nexora.worker.runner"]
    environment: *app_env
    depends_on:
      migrate: {condition: service_completed_successfully}
    restart: unless-stopped
    # SIGTERM lets the worker finish the job in progress before exiting.
    stop_grace_period: 60s

  web:
    image: nexora/web:local
    build: ./apps/web
    environment:
      NEXORA_API_UPSTREAM: api:8000
      NEXORA_GATEWAY_TOKEN: ${NEXORA_GATEWAY_TOKEN:-local-only-gateway-token-not-a-secret}
      # Same model as the deployment: the API authenticates every request (session sign-in page).
      # "basic" adds the legacy shared Basic credential in front (set user + password in .env).
      NEXORA_GATEWAY_AUTH: ${NEXORA_GATEWAY_AUTH:-session}
      NEXORA_GATEWAY_USER: ${NEXORA_GATEWAY_USER:-}
      NEXORA_GATEWAY_PASSWORD: ${NEXORA_GATEWAY_PASSWORD:-}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["127.0.0.1:8080:8080"]

volumes:
  pgdata:
