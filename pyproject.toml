[project]
name = "nexora"
version = "0.1.0"
description = "NEXORA AI — explainable, coverage-aware financial fraud-network investigation (SYNAPTIC LABS)"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2.0",
  "alembic",
  "psycopg[binary]>=3.2",
  "pydantic>=2.7",
  "pydantic-settings",
  "networkx>=3.3",
  "pyyaml",
  "python-multipart",
  "argon2-cffi>=23.1",
]

[dependency-groups]
dev = ["pytest", "httpx", "ruff", "mypy", "types-PyYAML", "hypothesis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexora"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
markers = ["integration: requires PostgreSQL (NEXORA_TEST_DATABASE_URL)"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict_optional = true
ignore_missing_imports = true
packages = ["nexora"]
mypy_path = "src"

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]
